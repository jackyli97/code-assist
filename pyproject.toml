[project]
name = "ai-coding-assistant"
version = "0.1.0"
description = "Local AI Coding Assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
    "openai>=2.15.0",
    "python-dotenv>=1.0.0",
]
[project.scripts]
code-assist = "ai_coding_assistant.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_coding_assistant"]
